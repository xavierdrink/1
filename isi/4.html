<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Audio Background</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial, Helvetica, sans-serif;
background:black;
}

.background{
position:fixed;
inset:0;
background:url('../assets/bg/5.png') center center/cover no-repeat;
}

.overlay{
position:fixed;
inset:0;
background:rgba(0,0,0,.35);
}

.controls{
position:fixed;
bottom:25px;
left:50%;
transform:translateX(-50%);

display:flex;
gap:15px;

padding:15px 20px;

background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);

border-radius:30px;
z-index:10;
}

button,a{
padding:14px 22px;
border:none;
border-radius:20px;

font-size:18px;
font-weight:bold;

cursor:pointer;
text-decoration:none;
color:white;
}

.play{
background:#51cf66;
}

.pause{
background:#fab005;
}

.restart{
background:#845ef7;
}

.back{
background:#ff6b6b;
}

@media(max-width:700px){

button,a{
font-size:15px;
padding:10px 14px;
}

.controls{
gap:10px;
padding:12px 14px;
}

}

</style>
</head>
<body>

<div class="background"></div>
<div class="overlay"></div>

<div class="controls">

<button class="play" onclick="playAudio()">
▶ Play
</button>

<button class="pause" onclick="pauseAudio()">
⏸ Pause
</button>

<button class="restart" onclick="restartAudio()">
🔄 Ulang
</button>

<a href="../index.html" class="back">
⬅ Kembali
</a>

</div>

<audio id="audio" src="../assets/bg/burungtytyd.mp3"></audio>

<script>

const audio=document.getElementById("audio");

function playAudio(){

audio.play();

}

function pauseAudio(){

audio.pause();

}

function restartAudio(){

audio.currentTime=0;
audio.play();

}

</script>

</body>
</html>
