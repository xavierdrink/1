<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rahasia Gigi Bersih dan Nafas Segar</title>

<style>

body{
margin:0;
overflow:hidden;
font-family:Arial, Helvetica, sans-serif;
background:black;
}

#stage{
width:100vw;
height:100vh;
background-image:url('../assets/bg/5.png');
background-size:cover;
background-position:center;
position:relative;
}

.overlay{
position:absolute;
inset:0;
background:rgba(0,0,0,.35);
}

.textbox{
position:absolute;
bottom:120px;
left:50%;
transform:translateX(-50%);
width:88%;
max-width:1200px;

background:rgba(0,0,0,.45);
backdrop-filter:blur(10px);

padding:30px;
border-radius:28px;

color:white;

box-shadow:0 0 20px rgba(0,0,0,.4);
}

.judul{
font-size:34px;
font-weight:bold;
color:#ffe066;
margin-bottom:15px;
text-shadow:0 0 10px rgba(255,224,102,.5);
}

.teks{
font-size:28px;
line-height:1.8;
}

.controls{
position:fixed;
bottom:20px;
left:50%;
transform:translateX(-50%);
display:flex;
gap:15px;
background:rgba(255,255,255,.2);
padding:14px 18px;
border-radius:30px;
backdrop-filter:blur(8px);
z-index:10;
}

button,a{
padding:14px 22px;
border:none;
border-radius:20px;
font-weight:bold;
text-decoration:none;
cursor:pointer;
color:white;
font-size:18px;
}

.play{
background:#51cf66;
}

.pause{
background:#fab005;
}

.back{
background:#ff6b6b;
}

.start{
position:fixed;
inset:0;
display:flex;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.5);
z-index:20;
}

.start button{
font-size:32px;
padding:22px 40px;
background:#51cf66;
}

@media(max-width:900px){

.textbox{
bottom:110px;
padding:22px;
}

.judul{
font-size:25px;
}

.teks{
font-size:19px;
line-height:1.7;
}

button,a{
font-size:15px;
padding:10px 14px;
}

}

</style>
</head>
<body>

<div id="stage">

<div class="overlay"></div>

<div class="textbox">

<div class="judul">
Rahasia Gigi Bersih dan Nafas Segar
</div>

<div class="teks">
Di pagi hari yang cerah, Arga dan Dita sedang belajar di kelas bersama Bu Devy.
Hari ini mereka belajar tentang pentingnya menjaga kebersihan gigi agar napas tetap segar,
gigi tetap sehat, dan teman-teman merasa nyaman saat berbicara bersama kita.
</div>

</div>

</div>

<div class="start" id="start">
<button onclick="mulai()">▶ Mulai Cerita</button>
</div>

<div class="controls">

<button class="play" onclick="playAudio()">
▶ Play
</button>

<button class="pause" onclick="pauseAudio()">
⏸ Pause
</button>

<button class="restart" onclick="restartAudio()">
🔄 Ulang
</button>

<a href="../index.html" class="back">
⬅ Kembali
</a>

</div>

<audio id="audio" src="../assets/narator.mp3"></audio>

<script>

const audio=document.getElementById("audio");

function mulai(){

document.getElementById("start").style.display="none";
audio.play();

}

function playAudio(){

audio.play();

}

function pauseAudio(){

audio.pause();

}

</script>

</body>
</html>
```
